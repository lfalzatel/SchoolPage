name: Send Event Notifications

on:
  schedule:
    # Run every hour from 10:00 UTC to 02:00 UTC (~5 AM to ~9 PM Colombia time)
    - cron: '0 10-23,0-2 * * *'
  workflow_dispatch: # Allows running manually from the GitHub UI

jobs:
  send-notifications:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm install

    - name: Run notification script
      env:
        FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      run: node scripts/send_notifications.js
