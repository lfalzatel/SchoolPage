<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Asistencia — Green Force</title>
    <meta name="description" content="Formulario de control de asistencia a salidas pedagógicas del Grupo Ambiental Green Force.">

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#059669">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Design System -->
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* ── Integración Tailwind + sistema premium ── */
        body { background-color: transparent !important; }

        /* Dark mode Tailwind compat */
        .dark-mode .bg-blue-50             { background-color: rgba(30, 58, 138, 0.2); }
        .dark-mode .bg-gray-50             { background-color: rgba(31, 41, 55, 0.4) !important; }
        .dark-mode .bg-gray-100            { background-color: rgba(55, 65, 81, 0.5); }
        .dark-mode .bg-white               { background-color: rgba(31, 41, 55, 0.8); }
        .dark-mode .text-gray-800          { color: #f3f4f6; }
        .dark-mode .text-gray-700          { color: #e5e7eb; }
        .dark-mode .text-gray-600          { color: #d1d5db; }
        .dark-mode .text-gray-500          { color: #9ca3af; }
        .dark-mode .border-b               { border-color: rgba(255, 255, 255, 0.1); }
        .dark-mode .hover\:bg-gray-50:hover { background-color: rgba(55, 65, 81, 0.3); }

        /* Toggle switch */
        .switch-input:checked + .switch-label { background-color: #22c55e !important; }

        /* Barra de estado de guardado */
        #save-status-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            font-size: 0.75rem;
            color: #6b7280;
            border-bottom: 1px solid #e5e7eb;
            background: #f9fafb;
        }
        .dark-mode #save-status-bar {
            background: rgba(31, 41, 55, 0.5);
            border-color: rgba(255,255,255,0.07);
            color: rgba(255,255,255,0.45);
        }
    </style>
</head>
<body>
    <!-- Fondo dinámico (iniciado por layout.js) -->
    <div id="app-background"></div>

    <!-- ► Placeholder de Header — layout.js lo reemplaza -->
    <div id="app-header-placeholder"></div>

    <!-- ── Contenido principal ────────────────────────────────────────────── -->
    <div class="page-wrapper">
        <div class="page-card" style="max-width: 1100px;">

            <!-- Encabezado de la sección -->
            <div class="page-header-section" style="text-align: center;">
                <h1><i class="fas fa-poll" style="margin-right: 10px;"></i>Control de Asistencia</h1>
                <p>Gestión de Salidas Pedagógicas — Grupo Ambiental Green Force</p>
            </div>

            <!-- Métricas en Tiempo Real -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-2 sm:gap-4 p-4 sm:p-6 bg-blue-50 border-b">
                <div class="bg-white p-4 rounded-lg shadow-sm border-l-4 border-green-500">
                    <p class="text-sm text-gray-500 font-semibold uppercase">Cubo Innovación</p>
                    <p id="count-cubo" class="text-3xl font-bold text-gray-800">0</p>
                </div>
                <div class="bg-white p-4 rounded-lg shadow-sm border-l-4 border-blue-500">
                    <p class="text-sm text-gray-500 font-semibold uppercase">UCO Investigación</p>
                    <p id="count-uco" class="text-3xl font-bold text-gray-800">0</p>
                </div>
                <div class="bg-white p-4 rounded-lg shadow-sm border-l-4 border-amber-500">
                    <p class="text-sm text-gray-500 font-semibold uppercase">Reserva CAM</p>
                    <p id="count-cam" class="text-3xl font-bold text-gray-800">0</p>
                </div>
            </div>

            <!-- Filtros y Acciones -->
            <div class="p-4 sm:p-6 flex flex-col sm:flex-row flex-wrap gap-2 sm:gap-4 items-stretch sm:items-center justify-between border-b">
                <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-2 w-full sm:w-auto">
                    <label class="font-bold text-gray-700">Filtrar Grado:</label>
                    <select id="filter-grado" class="border rounded-md px-3 py-2 focus:ring-2 focus:ring-emerald-500 outline-none w-full sm:w-auto">
                        <option value="all">Todos los grados</option>
                        <option value="6A">6A</option><option value="6B">6B</option><option value="6C">6C</option>
                        <option value="7A">7A</option><option value="8A">8A</option><option value="8B">8B</option>
                        <option value="9A">9A</option><option value="9B">9B</option><option value="10A">10A</option>
                        <option value="10B">10B</option><option value="11A">11A</option>
                    </select>
                </div>
                <div id="admin-tools-container" class="flex flex-col sm:flex-row items-stretch sm:items-center gap-2 w-full sm:w-auto" style="display: none;">
                    <input id="nuevo-evento" type="text" placeholder="Nombre del nuevo evento…"
                           class="border rounded-md px-3 py-2 focus:ring-2 focus:ring-emerald-500 outline-none w-full sm:w-auto" />
                    <button onclick="agregarEvento()"
                            class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg transition duration-200 w-full sm:w-auto">
                        <i class="fas fa-plus"></i> Agregar evento
                    </button>
                </div>
                <button onclick="generarResumen()"
                        class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 px-6 rounded-lg transition duration-200 w-full sm:w-auto">
                    <i class="fas fa-chart-bar"></i> Ver Resumen
                </button>
            </div>

            <!-- Barra de estado Firestore -->
            <div id="save-status-bar">
                <span id="save-status"><i class="fas fa-cloud"></i>&nbsp;Iniciando…</span>
            </div>

            <!-- Tabla de Estudiantes -->
            <div class="overflow-x-auto text-sm sm:text-base">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-100 text-gray-700 uppercase text-xs" id="event-header-row">
                            <th class="p-4 border-b">Estudiante</th>
                            <th class="p-4 border-b">Grado</th>
                            <!-- Columnas de eventos → generadas por JS -->
                        </tr>
                    </thead>
                    <tbody id="student-table-body">
                        <!-- Filas → generadas por JS -->
                    </tbody>
                </table>
            </div>

        </div>
    </div>

    <!-- ► Placeholder de Bottom Nav — layout.js lo reemplaza -->
    <div id="bottom-nav-placeholder"></div>

    <!-- Toast Container (compartido) -->
    <div id="toast-container"></div>

    <!-- ─── Scripts ─────────────────────────────────────────────────────── -->

    <!-- 1. Layout compartido (header + nav + tema + auth UI) -->
    <script type="module">
        import { initLayout } from './layout.js';
        import './gallery.js';
        initLayout({ activeNav: 'asistencia' });
    </script>

    <!-- 2. Lógica de asistencia con persistencia Firestore -->
    <script type="module">
        import { auth } from './auth.js';
        import { db } from './firebase-config.js';
        import { doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

        // ── Referencias Firestore ────────────────────────────────────────────
        const DOC_EVENTOS    = doc(db, 'asistencia_datos', 'eventos');
        const DOC_ASISTENCIA = doc(db, 'asistencia_datos', 'registros');

        // ── Datos constantes ─────────────────────────────────────────────────
        const EVENTOS_DEFAULT = [
            { key: 'cubo', nombre: 'Cubo Innovación' },
            { key: 'uco',  nombre: 'UCO Investigación' },
            { key: 'cam',  nombre: 'Reserva CAM' }
        ];

        const ESTUDIANTES = [
            { id: 1,  nombre: "Nicolás Gañán Bedoya (Líder)",        grado: "8B" },
            { id: 2,  nombre: "Melissa Vargas Franco (Líder)",        grado: "10B" },
            { id: 3,  nombre: "Julieta Gallego Builes",               grado: "11A" },
            { id: 4,  nombre: "Michel Parra Rodríguez",               grado: "11A" },
            { id: 5,  nombre: "Jalver Santiago Castillo Arenas",      grado: "11A" },
            { id: 6,  nombre: "Samir Jeronimo Brochero Ayala",        grado: "11A" },
            { id: 7,  nombre: "Estefanía Jiménez González",           grado: "10A" },
            { id: 8,  nombre: "Emanuel Mejia Monares",                grado: "10A" },
            { id: 9,  nombre: "Emiliano Henao Quintero",              grado: "10A" },
            { id: 10, nombre: "Jose Alejandro Ospina Echeverry",      grado: "10A" },
            { id: 11, nombre: "Dianny Dairely Saldaña García",        grado: "10B" },
            { id: 12, nombre: "Jeronimo Henao Giraldo",               grado: "10B" },
            { id: 13, nombre: "Emmanuel Osorio Melan",                grado: "10B" },
            { id: 14, nombre: "Mateo Buitrago Alzate",                grado: "10B" },
            { id: 15, nombre: "Emanuel Noreña Gallego",               grado: "9A" },
            { id: 16, nombre: "Emiliano Gómez Osorio",                grado: "9A" },
            { id: 17, nombre: "Isabel Cristina Restrepo",             grado: "9B" },
            { id: 18, nombre: "Liceth Sofia Quintero Martínez",       grado: "9B" },
            { id: 19, nombre: "Emanuel Alexander Acevedo",            grado: "9B" },
            { id: 20, nombre: "Dalismar de Jesus Torres Valor",       grado: "9B" },
            { id: 21, nombre: "Juana María Osorio Abad",              grado: "9B" },
            { id: 22, nombre: "Josua Martin Orbe Miño",               grado: "8B" },
            { id: 23, nombre: "Dilan Andrey Montoya Arango",          grado: "8A" },
            { id: 24, nombre: "Jacob Ramírez Tamayo",                 grado: "8A" },
            { id: 25, nombre: "David Preciado Usme",                  grado: "8A" },
            { id: 26, nombre: "Juan Felipe Guerrero Sierra",          grado: "8B" },
            { id: 27, nombre: "David Escobar Garzon",                 grado: "8B" },
            { id: 28, nombre: "Juan David Roldan Marín",              grado: "8A" },
            { id: 29, nombre: "Juan Sebastián Alzate Alzate",         grado: "7A" },
            { id: 30, nombre: "Isaac Ramírez Tamayo",                 grado: "6A" },
            { id: 31, nombre: "Jeronimo García Giraldo",              grado: "6B" },
            { id: 32, nombre: "Luna Valencia Álvarez",                grado: "6C" }
        ];

        // ── Estado en memoria ────────────────────────────────────────────────
        let eventos    = [...EVENTOS_DEFAULT];
        let asistencia = {};
        let saveTimer  = null;
        let canEditForm = false;

        // ── Auth Observer ────────────────────────────────────────────────────
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                try {
                    const userDoc = await getDoc(doc(db, 'users', user.uid));
                    const role = userDoc.exists() ? userDoc.data().role : null;
                    canEditForm = role === 'admin' || role === 'lider' || 
                                  user.email === 'greenforceiebb@gmail.com' || 
                                  user.email === 'lfalzatel@gmail.com';
                } catch(e) {
                    console.error("Error verificando rol:", e);
                    canEditForm = false;
                }
            } else {
                canEditForm = false;
            }
            
            const adminTools = document.getElementById('admin-tools-container');
            if (adminTools) {
                adminTools.style.display = canEditForm ? 'flex' : 'none';
            }
            renderTable(); // Re-render for switch state
        });

        // ── Indicador de estado ──────────────────────────────────────────────
        function setStatus(msg, type = 'info') {
            const el = document.getElementById('save-status');
            if (!el) return;
            const icons  = { saving: 'fa-spinner fa-spin', saved: 'fa-check-circle', error: 'fa-exclamation-circle', info: 'fa-cloud' };
            const colors = { saving: '#f59e0b', saved: '#10b981', error: '#ef4444', info: '#6b7280' };
            el.innerHTML = `<i class="fas ${icons[type]}" style="color:${colors[type]}"></i>&nbsp;${msg}`;
        }

        // ── Helpers ──────────────────────────────────────────────────────────
        function ensureStudentEntry(id) {
            if (!asistencia[id]) asistencia[id] = {};
            eventos.forEach(ev => {
                if (typeof asistencia[id][ev.key] === 'undefined')
                    asistencia[id][ev.key] = false;
            });
        }

        function initAsistencia() {
            ESTUDIANTES.forEach(e => ensureStudentEntry(e.id));
        }

        // ── Guardar en Firestore (debounce 800 ms) ───────────────────────────
        async function saveAll() {
            setStatus('Guardando…', 'saving');
            try {
                await setDoc(DOC_EVENTOS, { lista: eventos });
                const data = {};
                Object.entries(asistencia).forEach(([id, val]) => { data[`st_${id}`] = val; });
                await setDoc(DOC_ASISTENCIA, data);
                const now = new Date().toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' });
                setStatus(`Guardado a las ${now}`, 'saved');
            } catch (err) {
                console.error('Error guardando:', err);
                setStatus('Error al guardar', 'error');
            }
        }

        function scheduleSave() {
            clearTimeout(saveTimer);
            saveTimer = setTimeout(saveAll, 800);
        }

        // ── Cargar desde Firestore ───────────────────────────────────────────
        async function loadData() {
            setStatus('Cargando datos…', 'info');
            try {
                const evSnap = await getDoc(DOC_EVENTOS);
                eventos = (evSnap.exists() && evSnap.data().lista?.length)
                    ? evSnap.data().lista
                    : [...EVENTOS_DEFAULT];

                const asSnap = await getDoc(DOC_ASISTENCIA);
                if (asSnap.exists()) {
                    Object.entries(asSnap.data()).forEach(([key, val]) => {
                        const id = parseInt(key.replace('st_', ''), 10);
                        if (!isNaN(id)) asistencia[id] = val;
                    });
                }

                initAsistencia();
                renderTable();
                setStatus('Datos cargados', 'saved');
            } catch (err) {
                console.error('Error cargando:', err);
                setStatus('Sin conexión — datos temporales', 'error');
                initAsistencia();
                renderTable();
            }
        }

        // ── Render ───────────────────────────────────────────────────────────
        function renderTable() {
            const filter = document.getElementById('filter-grado').value;
            const tbody  = document.getElementById('student-table-body');
            tbody.innerHTML = '';

            document.getElementById('event-header-row').innerHTML = `
                <th class="p-4 border-b">Estudiante</th>
                <th class="p-4 border-b">Grado</th>
                ${eventos.map(ev => `<th class="p-4 border-b text-center">${ev.nombre}</th>`).join('')}
            `;

            ESTUDIANTES
                .filter(e => filter === 'all' || e.grado === filter)
                .forEach(e => {
                    ensureStudentEntry(e.id);
                    const row = document.createElement('tr');
                    row.className = 'hover:bg-gray-50 border-b transition-colors';
                    row.innerHTML = `
                        <td class="p-4 font-medium text-gray-800">${e.nombre}</td>
                        <td class="p-4 text-gray-600">${e.grado}</td>
                        ${eventos.map(ev => `<td class="p-4 text-center">${createSwitch(e.id, ev.key)}</td>`).join('')}
                    `;
                    tbody.appendChild(row);
                });

            updateMetrics();
        }

        function createSwitch(id, eventKey) {
            const on      = asistencia[id]?.[eventKey] ?? false;
            const checked = on ? 'checked' : '';
            const bg      = on ? 'bg-green-500' : 'bg-gray-300';
            const knob    = on ? 'translate-x-6' : '';
            const disabled = canEditForm ? '' : 'disabled';
            const cursor = canEditForm ? 'cursor-pointer' : 'cursor-not-allowed opacity-70';
            const labelCursor = canEditForm ? 'cursor-pointer' : '';

            return `
                <div class="inline-flex items-center ${cursor}">
                    <input type="checkbox" class="hidden switch-input" id="${eventKey}-${id}" ${checked} ${disabled}
                           onchange="window.toggleAsistencia(${id},'${eventKey}')">
                    <label for="${eventKey}-${id}"
                           class="switch-label w-12 h-6 ${bg} rounded-full relative transition duration-200 shadow-inner ${labelCursor}">
                        <div class="absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition-transform duration-200 ${knob}"></div>
                    </label>
                </div>`;
        }

        function updateMetrics() {
            ['cubo','uco','cam'].forEach(k => {
                const count = Object.values(asistencia).filter(a => a[k]).length;
                const el = document.getElementById(`count-${k}`);
                if (el) el.innerText = count;
            });
        }

        // ── Acciones globales ────────────────────────────────────────────────
        window.toggleAsistencia = (id, eventKey) => {
            if (!canEditForm) return;
            ensureStudentEntry(id);
            asistencia[id][eventKey] = !asistencia[id][eventKey];
            renderTable();
            scheduleSave();
        };

        window.agregarEvento = () => {
            if (!canEditForm) return;
            const input  = document.getElementById('nuevo-evento');
            const nombre = input.value.trim();
            if (!nombre) { alert('Ingresa un nombre para el evento.'); return; }
            let key = nombre.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'') || `evento_${eventos.length+1}`;
            if (eventos.some(ev => ev.key === key)) { alert('Ya existe un evento con ese nombre.'); return; }
            eventos.push({ key, nombre });
            ESTUDIANTES.forEach(e => ensureStudentEntry(e.id));
            input.value = '';
            renderTable();
            scheduleSave();
        };

        window.generarResumen = () => {
            const lista = Object.entries(asistencia)
                .map(([id, data]) => {
                    const est = ESTUDIANTES.find(e => e.id == id);
                    return eventos.some(ev => data[ev.key]) ? `${est?.nombre} (${est?.grado})` : null;
                }).filter(Boolean);
            alert(`📋 Resumen de Asistencia\n\nEstudiantes con al menos una asistencia: ${lista.length}\n\n${lista.join('\n')}`);
        };

        // ── Iniciar ──────────────────────────────────────────────────────────
        document.getElementById('filter-grado').addEventListener('change', renderTable);
        loadData();
    </script>
</body>
</html>
