    <style>
        .gallery-manage-container {

        } 

        .back-btn {

            gap: 8px;
            /* color: var(--text-secondary); */
            background: linear-gradient(135deg, #a3e635, #10b981);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;

        }

        .back-btn:hover {
            /* color: var(--primary);*/
            background: linear-gradient(135deg, #a3e635, #10b981);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text; 
            transform: scale(1.1);
            transition: all 0.2s ease-in-out;
        }

        .admin-actions {
            display: flex;
            gap: 1rem;
        }

        #galleryGridFull {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-secondary);
        }

        .empty-state i {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.2;
        }
        /* ── Year Selector: Sliding Track ── */
.year-selector-container {
  display: flex;
  justify-content: center;
}

.year-scroll {
  position: relative;
  display: inline-flex;
  align-items: center;
  background: rgba(255, 255, 255, 0.07);
  backdrop-filter: blur(16px) saturate(160%);
  -webkit-backdrop-filter: blur(16px) saturate(160%);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 50px;
  padding: 4px;
  box-shadow:
    0 4px 20px rgba(0, 0, 0, 0.2),
    inset 0 1px 0 rgba(255, 255, 255, 0.08);
}

/* Indicador deslizante */
.year-scroll::before {
  content: '';
  position: absolute;
  top: 4px;
  left: 4px;
  height: calc(100% - 8px);
  width: var(--pill-w, 70px);
  transform: translateX(var(--pill-x, 0px));
  background: linear-gradient(135deg, var(--primary, #10b981), #059669);
  border-radius: 40px;
  transition:
    transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1),
    width 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  box-shadow:
    0 3px 12px rgba(16, 185, 129, 0.35),
    0 0 0 1px rgba(16, 185, 129, 0.2);
  z-index: 0;
}

.year-pill {
  position: relative;
  z-index: 1;
  background: none;
  border: none;
  cursor: pointer;
  font-family: var(--font-main, 'Poppins', sans-serif);
  font-size: 0.78rem;
  font-weight: 600;
  color: rgba(255, 255, 255, 0.4);
  padding: 7px 16px;
  border-radius: 40px;
  transition: color 0.25s ease;
  white-space: nowrap;
  letter-spacing: 0.02em;
  outline: none;
  -webkit-tap-highlight-color: transparent;
}

.year-pill:hover:not(.active) {
  color: rgba(255, 255, 255, 0.7);
}

.year-pill.active {
  color: #ffffff;
  text-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
}

/* ── Compacto en móvil ── */
@media (max-width: 480px) {
  .year-pill {
    font-size: 0.72rem;
    padding: 6px 12px;
  }
}
    </style>

    <script type="module">
        import { initBackgroundSlideshow } from './gallery.js';
        import { auth } from './auth.js';
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

        document.addEventListener('DOMContentLoaded', () => {
            initBackgroundSlideshow();

            onAuthStateChanged(auth, (user) => {
                const adminPanel = document.getElementById('galleryAdminPanel');
                const overlay = document.getElementById('galleryOverlay');

                if (user) {
                    overlay.style.display = 'none';
                    // Simulación de rol admin (igual que en auth.js)
                    if (user.email === 'greenforceiebb@gmail.com') {
                        adminPanel.style.display = 'flex';
                    }
                    if (window.loadActivities) window.loadActivities('galleryGridFull');
                } else {
                    overlay.style.display = 'flex';
                    adminPanel.style.display = 'none';
                }
            });
        });
        // ── Year Selector: Sliding Track ──
const track = document.getElementById('yearTrack');
const pills = track.querySelectorAll('.year-pill');

function updateTrack(activePill) {
  pills.forEach(p => p.classList.remove('active'));
  activePill.classList.add('active');

  const trackRect = track.getBoundingClientRect();
  const pillRect  = activePill.getBoundingClientRect();

  track.style.setProperty('--pill-x', (pillRect.left - trackRect.left - 4) + 'px');
  track.style.setProperty('--pill-w', pillRect.width + 'px');

  // Conecta tu función de filtro aquí:
  // filterByYear(activePill.dataset.year);
}

// Inicializar en la pill activa por defecto
window.addEventListener('load', () => {
  const defaultActive = track.querySelector('.year-pill.active');
  if (defaultActive) updateTrack(defaultActive);
});

pills.forEach(pill => pill.addEventListener('click', () => updateTrack(pill)));
    </script>
