<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios — Green Force</title>
    <meta name="description" content="Panel de administración de usuarios del Grupo Ambiental Green Force.">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#059669">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">

    <style>
        body { background-color: transparent !important; }

        .toolbar {
            padding: 16px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            background: rgba(0, 0, 0, 0.12);
            border-radius: 16px 16px 0 0;
        }
        .dark-mode .toolbar { border-color: rgba(255,255,255,0.06); background: rgba(0, 0, 0, 0.3); }

        .search-box {
            flex: 1; min-width: 200px;
            display: flex; align-items: center; gap: 10px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px; padding: 8px 14px;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            color: #374151;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .dark-mode .search-box { background: rgba(255,255,255,0.04); color: #f3f4f6; }
        .search-box:focus-within {
            border-color: rgba(16, 185, 129, 0.5);
            box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.15);
        }
        .search-box input {
            border: none; background: transparent; outline: none;
            font-family: 'Poppins', sans-serif; font-size: 0.9rem;
            color: inherit; width: 100%;
        }
        .search-box i { color: #10b981; }

        .filter-select {
            border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 12px;
            padding: 8px 12px; font-family: 'Poppins', sans-serif;
            font-size: 0.85rem; background: rgba(255, 255, 255, 0.04); color: #374151; outline: none;
            cursor: pointer;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            transition: border-color 0.2s;
        }
        .filter-select:focus { border-color: #10b981; }
        .dark-mode .filter-select { background: rgba(255,255,255,0.04); color: #f3f4f6; }
        /* Style select options to ensure readability */
        .filter-select option, .role-select-input option, .modal-role-select option {
            background: #1f2937;
            color: #f3f4f6;
        }

        .user-count-badge {
            font-size: 0.8rem; color: #10b981; font-weight: 600;
            background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.15);
            padding: 6px 14px; border-radius: 20px;
        }
        .dark-mode .user-count-badge { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; }

        #users-list { padding: 16px; display: flex; flex-direction: column; gap: 12px; }

        .user-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 16px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        .user-card:hover {
            background: rgba(5, 150, 105, 0.08);
            border-color: rgba(16, 185, 129, 0.25);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(5, 150, 105, 0.2);
        }
        
        .user-main-info {
            display: flex;
            align-items: center;
            gap: 16px;
            flex: 1;
            min-width: 0;
        }

        .user-avatar-wrap { position: relative; flex-shrink: 0; }

        .user-avatar {
            width: 48px; height: 48px; border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(16, 185, 129, 0.3);
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            display: block;
        }
        .user-avatar-fallback {
            width: 48px; height: 48px; border-radius: 50%;
            background: linear-gradient(135deg, #059669, #10b981);
            color: white; font-weight: 700;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.9rem; flex-shrink: 0;
            border: 2px solid rgba(16, 185, 129, 0.3);
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .user-info { flex: 1; min-width: 0; }
        .user-name  { font-weight: 600; font-size: 1rem; color: #111827; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .user-email { font-size: 0.8rem; color: #6b7280; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .dark-mode .user-name  { color: #f3f4f6; }
        .dark-mode .user-email { color: #9ca3af; }
        .user-last-login { font-size: 0.72rem; color: #9ca3af; margin-top: 4px; display: flex; align-items: center; gap: 4px; }

        .role-selector {
            display: flex; align-items: center; gap: 8px; flex-shrink: 0;
        }

        .role-badge {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600;
        }
        .role-badge.admin      { background: #fef3c7; color: #92400e; }
        .role-badge.lider      { background: rgba(5, 150, 105, 0.15); color: #059669; }
        .role-badge.integrante { background: #d1fae5; color: #065f46; }
        .role-badge.usuario    { background: #f3f4f6; color: #374151; }
        .role-badge.miembro    { background: #dbeafe; color: #1e40af; }
        .dark-mode .role-badge.admin      { background: rgba(251,191,36,0.15);  color: #fcd34d; }
        .dark-mode .role-badge.lider      { background: rgba(16,185,129,0.15);  color: #6ee7b7; }
        .dark-mode .role-badge.integrante { background: rgba(52,211,153,0.15);  color: #a7f3d0; }
        .dark-mode .role-badge.usuario    { background: rgba(255,255,255,0.08); color: #d1d5db; }
        .dark-mode .role-badge.miembro    { background: rgba(59,130,246,0.15);  color: #93c5fd; }

        .role-select-input {
            border: 1px solid rgba(255,255,255,0.1); border-radius: 10px;
            padding: 6px 12px; font-family: 'Poppins', sans-serif; font-size: 0.82rem;
            background: rgba(255, 255, 255, 0.05); color: #374151; outline: none; cursor: pointer;
            transition: all 0.2s;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }
        .role-select-input:focus { border-color: #10b981; box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.15); }
        .dark-mode .role-select-input { color: #f3f4f6; }

        .save-role-btn {
            width: 34px; height: 34px; border-radius: 10px; border: none;
            background: #059669; color: white; cursor: pointer; font-size: 0.85rem;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s, transform 0.1s; flex-shrink: 0;
            box-shadow: 0 2px 6px rgba(5, 150, 105, 0.2);
        }
        .save-role-btn:hover  { background: #047857; transform: translateY(-1px); box-shadow: 0 4px 10px rgba(5, 150, 105, 0.35); }
        .save-role-btn:active { transform: translateY(0); }
        .save-role-btn.saving { background: #f59e0b; box-shadow: 0 2px 6px rgba(245, 158, 11, 0.2); }
        .save-role-btn.done   { background: #10b981; box-shadow: 0 2px 6px rgba(16, 185, 129, 0.2); }

        .empty-state {
            text-align: center; padding: 48px 24px; color: #9ca3af;
        }
        .empty-state i { font-size: 2.5rem; margin-bottom: 12px; display: block; opacity: 0.4; color: #10b981; }

        #access-denied {
            text-align: center; padding: 60px 24px; color: #ef4444; display: none;
        }
        #access-denied i { font-size: 3rem; display: block; margin-bottom: 12px; }
        #access-denied h2 { font-size: 1.3rem; font-weight: 700; }
        #access-denied p  { color: #6b7280; margin-top: 8px; }

        @media (max-width: 600px) {
            .user-card {
                flex-direction: column;
                align-items: stretch;
                gap: 14px;
                padding: 16px;
            }
            .user-main-info {
                width: 100%;
            }
            .role-selector {
                width: 100%;
                justify-content: flex-end;
                border-top: 1px solid rgba(255, 255, 255, 0.06);
                padding-top: 12px;
                margin-top: 4px;
            }
            .role-select-input {
                flex: 1;
            }
        }

        /* ══════════════════════════════════════════
           MODAL DE DETALLES DE USUARIO
        ══════════════════════════════════════════ */
        .user-modal-overlay {
            display: none;
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(4px);
            z-index: 9000;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            animation: fadeInOverlay 0.2s ease;
        }
        .user-modal-overlay.open { display: flex; }

        @keyframes fadeInOverlay { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUpModal  { from { opacity: 0; transform: translateY(30px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }

        .user-modal {
            background: white;
            border-radius: 24px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.3);
            overflow: hidden;
            animation: slideUpModal 0.25s cubic-bezier(0.34,1.56,0.64,1);
        }
        .dark-mode .user-modal { background: #1f2937; color: #f3f4f6; }

        /* Banner superior del modal */
        .modal-banner {
            background: linear-gradient(135deg, rgba(5, 150, 105, 0.95), rgba(4, 120, 87, 0.9));
            padding: 28px 24px 60px;
            position: relative;
            text-align: center;
        }
        .modal-close-btn {
            position: absolute; top: 14px; right: 14px;
            width: 32px; height: 32px; border-radius: 50%;
            background: rgba(255,255,255,0.2); border: none;
            color: white; cursor: pointer; font-size: 1rem;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.2s;
        }
        .modal-close-btn:hover { background: rgba(255,255,255,0.35); }

        /* Avatar grande en el modal */
        .modal-avatar-wrap {
            position: absolute;
            bottom: -44px; left: 50%;
            transform: translateX(-50%);
        }
        .modal-avatar {
            width: 88px; height: 88px; border-radius: 50%;
            object-fit: cover;
            border: 4px solid white;
            box-shadow: 0 8px 24px rgba(0,0,0,0.25);
            display: block;
        }
        .modal-avatar-fallback {
            width: 88px; height: 88px; border-radius: 50%;
            background: linear-gradient(135deg, rgba(5, 150, 105, 0.95), rgba(4, 120, 87, 0.9));
            border: 4px solid white;
            box-shadow: 0 8px 24px rgba(0,0,0,0.25);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.8rem; font-weight: 700; color: white;
        }

        /* Cuerpo del modal */
        .modal-body {
            padding: 60px 24px 28px;
            text-align: center;
        }
        .modal-name {
            font-size: 1.25rem; font-weight: 700;
            color: #111827; margin-bottom: 4px;
        }
        .dark-mode .modal-name { color: #f9fafb; }
        .modal-email {
            font-size: 0.85rem; color: #6b7280; margin-bottom: 16px;
        }

        .modal-chips {
            display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;
            margin-bottom: 24px;
        }
        .modal-chip {
            font-size: 0.78rem; font-weight: 600;
            padding: 5px 14px; border-radius: 20px;
            display: inline-flex; align-items: center; gap: 5px;
        }
        .chip-role-admin      { background: #fef3c7; color: #92400e; }
        .chip-role-lider      { background: #ede9fe; color: #5b21b6; }
        .chip-role-integrante { background: #d1fae5; color: #065f46; }
        .chip-role-usuario    { background: #f3f4f6; color: #374151; }
        .chip-role-miembro    { background: #dbeafe; color: #1e40af; }

        /* Detalles en tabla */
        .modal-details {
            background: #f9fafb;
            border-radius: 14px;
            padding: 16px;
            text-align: left;
            margin-bottom: 20px;
        }
        .dark-mode .modal-details { background: rgba(255,255,255,0.06); }

        .modal-detail-row {
            display: flex; align-items: flex-start; gap: 12px;
            padding: 8px 0;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            font-size: 0.85rem;
        }
        .dark-mode .modal-detail-row { border-color: rgba(255,255,255,0.06); }
        .modal-detail-row:last-child { border-bottom: none; }
        .modal-detail-row i {
            width: 18px; color: #059669; margin-top: 2px; flex-shrink: 0;
        }
        .detail-label { color: #9ca3af; font-size: 0.75rem; }
        .detail-value { color: #111827; font-weight: 500; word-break: break-all; }
        .dark-mode .detail-value { color: #f3f4f6; }

        /* Selector de rol dentro del modal */
        .modal-role-section {
            border-top: 1px solid rgba(0,0,0,0.07);
            padding-top: 18px;
        }
        .dark-mode .modal-role-section { border-color: rgba(255,255,255,0.08); }
        .modal-role-label {
            font-size: 0.8rem; font-weight: 600; color: #6b7280;
            text-transform: uppercase; letter-spacing: 0.05em;
            margin-bottom: 10px;
        }
        .modal-role-row {
            display: flex; gap: 8px; align-items: center;
        }
        .modal-role-select {
            flex: 1; border: 1.5px solid #e5e7eb; border-radius: 10px;
            padding: 8px 12px; font-family: 'Poppins', sans-serif; font-size: 0.85rem;
            background: white; color: #374151; outline: none; cursor: pointer;
        }
        .modal-role-select:focus { border-color: #059669; }
        .dark-mode .modal-role-select { background: rgba(255,255,255,0.07); border-color: rgba(255,255,255,0.1); color: #f3f4f6; }

        .modal-save-btn {
            padding: 8px 18px; border-radius: 10px; border: none;
            background: #059669; color: white; font-family: 'Poppins', sans-serif;
            font-size: 0.85rem; font-weight: 600; cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            white-space: nowrap;
        }
        .modal-save-btn:hover  { background: #047857; }
        .modal-save-btn:active { transform: scale(0.96); }
        .modal-save-btn.saving { background: #f59e0b; }
        .modal-save-btn.done   { background: #10b981; }
    </style>
</head>
<body>
    <div id="app-background"></div>
    <div id="app-header-placeholder"></div>

    <div class="page-wrapper">
        <div class="page-card">

            <div class="page-header-section">
                <h1><i class="fas fa-users-cog" style="margin-right:10px;"></i>Gestión de Usuarios</h1>
                <p>Asigna roles a los miembros del Grupo Ambiental Green Force</p>
            </div>

            <div id="access-denied">
                <i class="fas fa-lock"></i>
                <h2>Acceso restringido</h2>
                <p>Solo los administradores pueden gestionar usuarios.</p>
                <a href="index.html" style="margin-top:16px;display:inline-block;color:#059669;font-weight:600;">
                    <i class="fas fa-arrow-left"></i> Volver al inicio
                </a>
            </div>

            <div id="main-content" style="display:none;">
                <div class="toolbar">
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input id="search-input" type="text" placeholder="Buscar por nombre o correo…">
                    </div>
                    <select id="filter-role" class="filter-select">
                        <option value="all">Todos los roles</option>
                        <option value="admin">👑 Admin</option>
                        <option value="lider">⭐ Líder</option>
                        <option value="integrante">🌿 Integrante</option>
                        <option value="usuario">👤 Usuario</option>
                        <option value="miembro">👥 Miembro</option>
                    </select>
                    <span class="user-count-badge" id="user-count">Cargando…</span>
                </div>

                <div id="users-list">
                    <div class="empty-state">
                        <i class="fas fa-spinner fa-spin"></i>
                        Cargando usuarios…
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- ══════════════════════════════════════════
         MODAL DE DETALLES DE USUARIO
    ══════════════════════════════════════════ -->
    <div class="user-modal-overlay" id="userModal" onclick="handleOverlayClick(event)">
        <div class="user-modal">
            <div class="modal-banner">
                <button class="modal-close-btn" onclick="closeUserModal()">
                    <i class="fas fa-times"></i>
                </button>
                <div class="modal-avatar-wrap">
                    <img id="modal-avatar-img" class="modal-avatar" src="" alt="" referrerpolicy="no-referrer"
                         onerror="this.style.display='none';document.getElementById('modal-avatar-fallback').style.display='flex';">
                    <div id="modal-avatar-fallback" class="modal-avatar-fallback" style="display:none;"></div>
                </div>
            </div>

            <div class="modal-body">
                <div class="modal-name" id="modal-name">—</div>
                <div class="modal-email" id="modal-email">—</div>

                <div class="modal-chips">
                    <span class="modal-chip" id="modal-role-chip">—</span>
                </div>

                <div class="modal-details">
                    <div class="modal-detail-row">
                        <i class="fas fa-clock"></i>
                        <div>
                            <div class="detail-label">Último acceso</div>
                            <div class="detail-value" id="modal-last-login">—</div>
                        </div>
                    </div>
                    <div class="modal-detail-row">
                        <i class="fas fa-fingerprint"></i>
                        <div>
                            <div class="detail-label">UID Firebase</div>
                            <div class="detail-value" id="modal-uid" style="font-size:0.72rem;font-family:monospace;">—</div>
                        </div>
                    </div>
                    <div class="modal-detail-row">
                        <i class="fas fa-calendar-alt"></i>
                        <div>
                            <div class="detail-label">Fecha de registro</div>
                            <div class="detail-value" id="modal-created">—</div>
                        </div>
                    </div>
                </div>

                <!-- Cambiar rol desde el modal -->
                <div class="modal-role-section">
                    <div class="modal-role-label"><i class="fas fa-user-tag"></i> Cambiar rol</div>
                    <div class="modal-role-row">
                        <select class="modal-role-select" id="modal-role-select">
                            <option value="admin">👑 Admin</option>
                            <option value="lider">⭐ Líder</option>
                            <option value="integrante">🌿 Integrante</option>
                            <option value="usuario">👤 Usuario</option>
                            <option value="miembro">👥 Miembro</option>
                        </select>
                        <button class="modal-save-btn" id="modal-save-btn" onclick="saveRoleFromModal()">
                            Guardar
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="bottom-nav-placeholder"></div>
    <div id="toast-container"></div>

    <script type="module">
        import { initLayout } from './layout.js';
        import './gallery.js';
        initLayout({ activeNav: null });
    </script>

    <script type="module">
        import { auth, db } from './firebase-config.js';
        import {
            collection, getDocs, doc, updateDoc, getDoc
        } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

        const ADMIN_EMAILS = ['greenforceiebb@gmail.com', 'lfalzatel@gmail.com'];
        const ROLE_LABELS  = {
            admin:      '👑 Admin',
            lider:      '⭐ Líder',
            integrante: '🌿 Integrante',
            usuario:    '👤 Usuario',
            miembro:    '👥 Miembro',
        };
        const ROLE_CHIP_CLASS = {
            admin:      'chip-role-admin',
            lider:      'chip-role-lider',
            integrante: 'chip-role-integrante',
            usuario:    'chip-role-usuario',
            miembro:    'chip-role-miembro',
        };

        let allUsers = [];
        let currentModalUid = null;

        // ── Verificar acceso ─────────────────────────────────────────────────
        onAuthStateChanged(auth, async (user) => {
            if (!user) { showDenied(); return; }
            let role = ADMIN_EMAILS.includes(user.email) ? 'admin' : 'miembro';
            try {
                const snap = await getDoc(doc(db, 'users', user.uid));
                if (snap.exists() && snap.data().role) role = snap.data().role;
            } catch (_) {}
            if (role !== 'admin') { showDenied(); return; }
            document.getElementById('main-content').style.display = 'block';
            loadUsers();
        });

        function showDenied() {
            document.getElementById('access-denied').style.display = 'block';
        }

        // ── Cargar usuarios ──────────────────────────────────────────────────
        async function loadUsers() {
            try {
                const snap = await getDocs(collection(db, 'users'));
                allUsers = snap.docs
                    .map(d => ({ id: d.id, ...d.data() }))
                    .sort((a, b) => (a.name || '').localeCompare(b.name || '', 'es'));
                renderUsers(allUsers);
            } catch (err) {
                console.error('Error cargando usuarios:', err);
                document.getElementById('users-list').innerHTML =
                    `<div class="empty-state">
                        <i class="fas fa-exclamation-triangle"></i>
                        <p>Error al cargar usuarios.</p>
                        <small style="color:#9ca3af;">${err.message}</small>
                     </div>`;
            }
        }

        // ── Renderizar lista ─────────────────────────────────────────────────
        function renderUsers(users) {
            const list  = document.getElementById('users-list');
            const count = document.getElementById('user-count');
            if (count) count.textContent = `${users.length} usuario${users.length !== 1 ? 's' : ''}`;

            if (!users.length) {
                list.innerHTML = `<div class="empty-state"><i class="fas fa-users-slash"></i>No se encontraron usuarios.</div>`;
                return;
            }

            list.innerHTML = users.map((u, i) => {
                const role      = u.role || 'miembro';
                const initials  = getInitials(u.name);
                const lastLogin = formatDate(u.lastLogin);
                const avatarHtml = buildAvatarHtml(u.photo, u.name, initials, 'user-avatar', 'user-avatar-fallback');

                return `
                <div class="user-card" data-uid="${u.id}" onclick="openUserModal('${u.id}')">
                    <div class="user-main-info">
                        ${avatarHtml}
                        <div class="user-info">
                            <div class="user-name">${u.name || 'Sin nombre'}</div>
                            <div class="user-email">${u.email || '—'}</div>
                            <div class="user-last-login">
                                <i class="fas fa-clock" style="font-size:0.65rem;margin-right:3px;"></i>
                                Último acceso: ${lastLogin}
                            </div>
                        </div>
                    </div>
                    <div class="role-selector" onclick="event.stopPropagation()">
                        <select class="role-select-input" data-uid="${u.id}">
                            <option value="admin"      ${role==='admin'      ?'selected':''}>👑 Admin</option>
                            <option value="lider"      ${role==='lider'      ?'selected':''}>⭐ Líder</option>
                            <option value="integrante" ${role==='integrante' ?'selected':''}>🌿 Integrante</option>
                            <option value="usuario"    ${role==='usuario'    ?'selected':''}>👤 Usuario</option>
                            <option value="miembro"    ${role==='miembro'    ?'selected':''}>👥 Miembro</option>
                        </select>
                        <button class="save-role-btn" title="Guardar rol"
                                onclick="saveRole('${u.id}', this)">
                            <i class="fas fa-check"></i>
                        </button>
                    </div>
                </div>`;
            }).join('');
        }

        // ── Helpers ──────────────────────────────────────────────────────────
        function getInitials(name) {
            return (name || '?').split(' ').map(w => w[0]).slice(0,2).join('').toUpperCase();
        }

        function formatDate(ts) {
            if (!ts) return '—';
            try {
                const d = ts?.toDate ? ts.toDate() : new Date(ts);
                return d.toLocaleDateString('es-CO', { day:'2-digit', month:'short', year:'numeric' });
            } catch { return '—'; }
        }

        // ✅ FIX: usa clase CSS, no nextSibling (que puede ser un nodo de texto)
        function buildAvatarHtml(photo, name, initials, imgClass, fallbackClass) {
            if (photo) {
                return `
                <div class="user-avatar-wrap">
                    <img src="${photo}" alt="${name || ''}" class="${imgClass}" referrerpolicy="no-referrer"
                         onerror="this.style.display='none';this.parentElement.querySelector('.${fallbackClass}').style.display='flex';">
                    <div class="${fallbackClass}" style="display:none;">${initials}</div>
                </div>`;
            }
            return `<div class="user-avatar-fallback">${initials}</div>`;
        }

        // ── Modal de detalles ─────────────────────────────────────────────────
        window.openUserModal = function(uid) {
            const u = allUsers.find(u => u.id === uid);
            if (!u) return;
            currentModalUid = uid;

            const role     = u.role || 'miembro';
            const initials = getInitials(u.name);

            // Avatar
            const imgEl      = document.getElementById('modal-avatar-img');
            const fallbackEl = document.getElementById('modal-avatar-fallback');
            if (u.photo) {
                imgEl.src = u.photo;
                imgEl.style.display = 'block';
                fallbackEl.style.display = 'none';
            } else {
                imgEl.style.display = 'none';
                fallbackEl.style.display = 'flex';
                fallbackEl.textContent = initials;
            }

            // Datos
            document.getElementById('modal-name').textContent  = u.name  || 'Sin nombre';
            document.getElementById('modal-email').textContent = u.email || '—';
            document.getElementById('modal-uid').textContent   = uid;
            document.getElementById('modal-last-login').textContent = formatDate(u.lastLogin);
            document.getElementById('modal-created').textContent    = formatDate(u.createdAt) || '—';

            // Chip de rol
            const chip = document.getElementById('modal-role-chip');
            chip.textContent = ROLE_LABELS[role] || role;
            chip.className   = `modal-chip ${ROLE_CHIP_CLASS[role] || ''}`;

            // Selector de rol
            document.getElementById('modal-role-select').value = role;

            // Resetear botón guardar
            const btn = document.getElementById('modal-save-btn');
            btn.textContent = 'Guardar';
            btn.className   = 'modal-save-btn';
            btn.disabled    = false;

            document.getElementById('userModal').classList.add('open');
        };

        window.closeUserModal = function() {
            document.getElementById('userModal').classList.remove('open');
            currentModalUid = null;
        };

        window.handleOverlayClick = function(e) {
            if (e.target.id === 'userModal') closeUserModal();
        };

        // ── Guardar rol desde el modal ────────────────────────────────────────
        window.saveRoleFromModal = async function() {
            if (!currentModalUid) return;
            const newRole = document.getElementById('modal-role-select').value;
            const btn     = document.getElementById('modal-save-btn');

            btn.textContent = 'Guardando…';
            btn.className   = 'modal-save-btn saving';
            btn.disabled    = true;

            try {
                await updateDoc(doc(db, 'users', currentModalUid), { role: newRole });

                // Actualizar en memoria y en la tarjeta de la lista
                const usr = allUsers.find(u => u.id === currentModalUid);
                if (usr) usr.role = newRole;
                const sel = document.querySelector(`.role-select-input[data-uid="${currentModalUid}"]`);
                if (sel) sel.value = newRole;

                // Actualizar chip del modal
                const chip = document.getElementById('modal-role-chip');
                chip.textContent = ROLE_LABELS[newRole];
                chip.className   = `modal-chip ${ROLE_CHIP_CLASS[newRole] || ''}`;

                btn.textContent = '✓ Guardado';
                btn.className   = 'modal-save-btn done';
                setTimeout(() => {
                    btn.textContent = 'Guardar';
                    btn.className   = 'modal-save-btn';
                    btn.disabled    = false;
                }, 1800);

                showToast(`Rol actualizado a "${ROLE_LABELS[newRole]}"`, 'success');
            } catch (err) {
                console.error('Error guardando rol:', err);
                btn.textContent = 'Error';
                btn.style.background = '#ef4444';
                setTimeout(() => {
                    btn.textContent = 'Guardar';
                    btn.style.background = '';
                    btn.className   = 'modal-save-btn';
                    btn.disabled    = false;
                }, 2000);
                showToast('Error al guardar. Verifica permisos.', 'error');
            }
        };

        // ── Guardar rol desde la lista (botón check) ──────────────────────────
        window.saveRole = async (uid, btn) => {
            const select  = document.querySelector(`.role-select-input[data-uid="${uid}"]`);
            const newRole = select?.value;
            if (!newRole) return;

            btn.classList.add('saving');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            btn.disabled  = true;

            try {
                await updateDoc(doc(db, 'users', uid), { role: newRole });
                const usr = allUsers.find(u => u.id === uid);
                if (usr) usr.role = newRole;

                btn.classList.remove('saving');
                btn.classList.add('done');
                btn.innerHTML = '<i class="fas fa-check"></i>';
                setTimeout(() => {
                    btn.classList.remove('done');
                    btn.innerHTML = '<i class="fas fa-check"></i>';
                    btn.disabled  = false;
                }, 1500);
                showToast(`Rol actualizado a "${ROLE_LABELS[newRole]}"`, 'success');
            } catch (err) {
                btn.classList.remove('saving');
                btn.style.background = '#ef4444';
                btn.innerHTML = '<i class="fas fa-times"></i>';
                setTimeout(() => {
                    btn.style.background = '';
                    btn.classList.remove('done');
                    btn.innerHTML = '<i class="fas fa-check"></i>';
                    btn.disabled  = false;
                }, 2000);
                showToast('Error al guardar. Verifica permisos.', 'error');
            }
        };

        // ── Toast ─────────────────────────────────────────────────────────────
        function showToast(msg, type = 'info') {
            if (window.showToast) { window.showToast(msg, type); return; }
            const tc = document.getElementById('toast-container');
            if (!tc) return;
            const t = document.createElement('div');
            t.style.cssText = `position:fixed;bottom:90px;left:50%;transform:translateX(-50%);
                background:${type==='success'?'#10b981':type==='error'?'#ef4444':'#6b7280'};
                color:white;padding:10px 20px;border-radius:10px;font-size:0.85rem;
                font-family:Poppins,sans-serif;z-index:9999;white-space:nowrap;`;
            t.textContent = msg;
            tc.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }

        // ── Filtros ───────────────────────────────────────────────────────────
        document.getElementById('search-input').addEventListener('input', applyFilters);
        document.getElementById('filter-role').addEventListener('change', applyFilters);

        function applyFilters() {
            const search = document.getElementById('search-input').value.toLowerCase();
            const role   = document.getElementById('filter-role').value;
            const filtered = allUsers.filter(u => {
                const matchSearch = !search ||
                    (u.name  || '').toLowerCase().includes(search) ||
                    (u.email || '').toLowerCase().includes(search);
                const matchRole = role === 'all' || (u.role || 'miembro') === role;
                return matchSearch && matchRole;
            });
            renderUsers(filtered);
        }
    </script>
</body>
</html>
