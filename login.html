<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Green Force</title>
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2E7D32">
    <link rel="icon" type="image/png" href="assets/icons/icon-192.png">

    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background-color: #000;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 1rem;
            overflow-y: auto;
            /* Allow vertical scrolling if content overflows */
        }

        /* Slideshow background system */
        #bg-slideshow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .bg-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            z-index: 0;
        }

        .bg-slide.active {
            opacity: 1;
            z-index: 2;
        }

        .bg-slide.last-active {
            opacity: 1;
            z-index: 1;
        }

        .bg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.7));
            z-index: 10;
        }

        .dark-mode body {
            /* Same dark overlay in dark mode */
            background-image: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.75)), url('assets/images/10.%20Reforestaci%C3%B3n%20institucional%20-%204.jpg');
        }

        /* ===== ANIMACIÓN ===== */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-container {
            background: rgba(255, 255, 255, 0.3);
            color: #f5f3f3;
            width: 340px;
            /* User suggested width */
            max-width: 90%;
            /* Responsive fallback */
            max-height: 90vh; /* Limit height for small mobiles */
            overflow-y: auto; /* Allow internal scrolling if needed */
            -ms-overflow-style: none; /* IE and Edge hide scrollbar */
            scrollbar-width: none; /* Firefox hide scrollbar */
            padding: 24px 24px;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            text-align: center;
            backdrop-filter: blur(5px);
            animation: fadeIn 0.6s ease;
        }
        
        .login-container::-webkit-scrollbar {
            display: none; /* Chrome/Safari/Webkit hide scrollbar */
        }

        .dark-mode .login-container {
            background: rgba(30, 30, 30, 0.3);
            color: #ddd;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .login-logo img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            border-radius: 50%;
            margin-bottom: 0.5rem;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .login-title {
            color: #333;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .dark-mode .login-title {
            color: #fff;
        }

        .login-subtitle {
            color: #c8c6c6;
            margin-bottom: 1.0rem;
            font-size: 0.85rem;
        }

        .dark-mode .login-subtitle {
            color: #aaa;
        }

        .form-group {
            margin-bottom: 14px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            font-weight: 600;
            color: #666;
        }

        .dark-mode .form-group label {
            color: #ccc;
        }

        .form-input {
            width: 100%;
            padding: 11px 12px;
            border-radius: 10px;
            border: 1px solid #e3e3e3;
            outline: none;
            transition: all 0.25s ease;
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
        }

        .form-input:focus {
            border-color: #6f42c1;
            box-shadow: 0 0 0 3px rgba(111, 66, 193, 0.15);
        }

        .dark-mode .form-input {
            background: #2b2b2b;
            border-color: #444;
            color: #fff;
        }

        .dark-mode .form-input::placeholder {
            color: #888;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(111, 66, 193, 0.3);
        }

        .btn-submit:active {
            transform: scale(0.97);
        }

        .divider {
            margin: 1.2rem 0;
            /* Reduced margin */
            display: flex;
            align-items: center;
            color: #fdf9f9;
            font-size: 0.85rem;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #ddd;
        }

        .divider span {
            padding: 0 10px;
        }

        .google-btn {
            background: white;
            color: #333;
            border: 1px solid #ddd;
            width: 100%;
            padding: 0.8rem;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
        }

        .login-google-primary {
            margin-top: 0.25rem;
            margin-bottom: 0;
        }

        .google-btn:hover {
            background: #f5f5f5;
        }

        .dark-mode .google-btn {
            background: #333;
            color: white;
            border-color: #555;
        }

        .dark-mode .google-btn:hover {
            background: #444;
        }

        .back-link {
            display: block;
            margin-top: 1.5rem;
            color: #666;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back-link:hover {
            color: var(--primary-color);
        }

        .dark-mode .back-link {
            color: #aaa;
        }

        /* Fix: Dropdown hereda color blanco del header verde */
        .profile-dropdown .dropdown-item {
            color: #4b5563 !important;
        }

        .profile-dropdown .dropdown-item.text-red {
            color: #ef4444 !important;
        }

        .profile-dropdown .dropdown-item i {
            color: #9ca3af !important;
        }

        .profile-dropdown .dropdown-item:hover {
            color: #111827 !important;
            background-color: #f9fafb;
        }

        .profile-dropdown .dropdown-item:hover i {
            color: #059669 !important;
        }

        #menuProfileName {
            color: #111827 !important;
        }

        .profile-dropdown .text-gray {
            color: #6b7280 !important;
        }

        /* ===== AUTH LOADER CSS ===== */
        #auth-loader {
            position: fixed; inset: 0; background: #050f0a;
            display: none; justify-content: center; align-items: center;
            z-index: 999999 !important;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        #auth-loader.show { display: flex; }
        .splash-content { display: flex; flex-direction: column; align-items: center; gap: 0.5rem; }
        .splash-logo-wrap { position: relative; width: 96px; height: 96px; margin-bottom: 0.5rem; }
        .splash-logo {
            width: 96px; height: 96px; border-radius: 50%; object-fit: cover;
            animation: splashPop 0.6s cubic-bezier(0.34,1.56,0.64,1) both;
        }
        .splash-ring {
            position: absolute; inset: -8px; border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: #10b981; border-right-color: #10b981;
            animation: splashSpin 1.2s linear infinite;
        }
        .splash-title {
            font-family: 'Poppins', sans-serif; font-size: 1.4rem; font-weight: 700;
            color: #fff; margin: 0;
            animation: splashFade 0.6s ease 0.3s both;
        }
        .splash-sub {
            font-family: 'Poppins', sans-serif; font-size: 0.78rem;
            color: rgba(16,185,129,0.8); letter-spacing: 0.15em;
            text-transform: uppercase; margin: 0;
            animation: splashFade 0.6s ease 0.5s both;
        }
        .splash-bar-wrap {
            width: 120px; height: 3px; background: rgba(255,255,255,0.08);
            border-radius: 99px; margin-top: 1.2rem; overflow: hidden;
            animation: splashFade 0.6s ease 0.6s both;
        }
        .splash-bar {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, #10b981, #34d399);
            border-radius: 99px;
            animation: splashLoad 2.4s ease 0.6s forwards;
        }
        @keyframes splashSpin { to { transform: rotate(360deg); } }
        @keyframes splashPop  { from { opacity:0; transform:scale(0.7); } to { opacity:1; transform:scale(1); } }
        @keyframes splashFade { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
        @keyframes splashLoad { 0%{width:0%} 60%{width:75%} 100%{width:100%} }

        /* Anti-flash logic */
        body.is-redirecting .login-container {
            display: none !important;
        }
        body.is-redirecting #auth-loader {
            display: flex !important;
        }
    </style>
</head>

<body>
    <!-- Scripts anti-flash justo después del body check -->
    <script>
        if (sessionStorage.getItem('googleLoginRedirecting') === 'true') {
            document.body.classList.add('is-redirecting');
        }
    </script>

    <div id="app-background">
        <div class="bg-overlay"></div>
    </div>

    <!-- Official Auth Loader (Splash Screen) -->
    <div id="auth-loader">
        <div class="splash-content">
            <div class="splash-logo-wrap">
                <img src="assets/images/1. logo 3.jpg" alt="Green Force" class="splash-logo">
                <div class="splash-ring"></div>
            </div>
            <p class="splash-title">Green Force</p>
            <p class="splash-sub">Sembrando Futuro</p>
            <p id="splash-status" class="splash-sub" style="margin-top: 5px; color: #fff; font-size: 0.70rem; opacity: 0.8; text-transform: none; letter-spacing: 0.05em;">Verificando cuenta...</p>
            <div class="splash-bar-wrap"><div class="splash-bar"></div></div>
        </div>
    </div>

    <div class="login-container">
        <div class="login-logo">
            <img src="assets/images/1. logo 3.jpg" alt="Green Force Logo">
        </div>
        <h2 class="login-title">Bienvenido a Green Force</h2>
        <p class="login-subtitle">Accede para gestionar actividades y ver contenido exclusivo</p>

        <button id="googleLoginBtn" type="button" class="google-btn login-google-primary">
            <i class="fab fa-google" style="color: #DB4437;"></i>
            <span id="googleBtnText">Iniciar con Google</span>
        </button>

        <div class="divider" id="toggleEmailFormBtn" style="cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; user-select: none; margin: 1.2rem 0; color: rgba(255,255,255,0.85); font-size: 0.85rem; font-weight: 500;">
            <span>O ingresar con correo y contraseña</span>
            <i class="fas fa-chevron-down" id="emailChevron" style="transition: transform 0.3s ease; font-size: 0.8rem;"></i>
        </div>

        <form id="loginForm" style="display: none; margin-top: 0.8rem; transition: all 0.3s ease;">
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <div style="position: relative;">
                    <i class="fas fa-envelope" style="position: absolute; left: 15px; top: 15px; color: #888;"></i>
                    <input type="email" id="email" class="form-input" placeholder="ejemplo@greenforce.com"
                        style="padding-left: 40px;" required>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <div style="position: relative;">
                    <i class="fas fa-lock" style="position: absolute; left: 15px; top: 15px; color: #888;"></i>
                    <input type="password" id="password" class="form-input" placeholder="••••••••"
                        style="padding-left: 40px;" required>
                </div>
            </div>

            <button type="submit" class="btn-submit">
                <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
            </button>
        </form>

        <script>
            document.getElementById('toggleEmailFormBtn')?.addEventListener('click', () => {
                const form = document.getElementById('loginForm');
                const chevron = document.getElementById('emailChevron');
                if (form) {
                    const isHidden = form.style.display === 'none';
                    form.style.display = isHidden ? 'block' : 'none';
                    if (chevron) {
                        chevron.style.transform = isHidden ? 'rotate(180deg)' : 'rotate(0deg)';
                    }
                }
            });
        </script>

        <button id="installAppBtn" class="google-btn"
            style="display: none; margin-top: 1rem; background: #2E7D32; color: white; border: none;">
            <i class="fas fa-download"></i> Instalar Aplicación
        </button>

        <div id="authStatus" style="margin-top: 1rem; font-size: 0.85rem; color: #555;"></div>

        <div style="margin-top: 2rem;">
            <button onclick="window.forceFullReload();"
                style="background: none; border: 1px solid #ccc; color: #fdfcfc; padding: 0.5rem 1rem; border-radius: 5px; font-size: 0.8rem; cursor: pointer;">
                Forzar Recarga Completa (Limpiar Caché)
            </button>
            <br>
            <a href="#" id="createTestUserBtn"
                style="color: #fefefe; text-decoration: none; font-size: 0.7rem; display: block; margin-top: 10px;">(Debug:
                Crear Usuario de Prueba)</a>
        </div>
    </div>

    <script>
        window.onerror = function (msg, url, lineNo, columnNo, error) {
            console.error('GLOBAL ERROR:', msg, 'at', url, 'line', lineNo);
            // alert('Error crítico de carga: ' + msg); 
            return false;
        };
    </script>
    <script>
        // --- PWA Installation Logic ---
        let deferredPrompt;
        const installBtn = document.getElementById('installAppBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            if (installBtn) installBtn.style.display = 'flex';
            installBtn.style.display = 'flex';
            console.log('beforeinstallprompt fired');
        });

        async function forceFullReload() {
            console.log("Starting forced full reload...");
            try {
                if ('serviceWorker' in navigator) {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    for (let registration of registrations) {
                        await registration.unregister();
                        console.log("Service Worker unregistered");
                    }
                }
                const cacheNames = await caches.keys();
                for (let name of cacheNames) {
                    await caches.delete(name);
                    console.log("Cache deleted:", name);
                }
                localStorage.clear();
                sessionStorage.clear();
                console.log("Storage cleared, reloading...");
                window.location.reload(true);
            } catch (err) {
                console.error("Error during force reload:", err);
                window.location.reload(true);
            }
        }
        window.forceFullReload = forceFullReload;

        installBtn.addEventListener('click', async () => {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            console.log(`User response to the install prompt: ${outcome}`);
            deferredPrompt = null;
            installBtn.style.display = 'none';
        });

        window.addEventListener('appinstalled', () => {
            installBtn.style.display = 'none';
            deferredPrompt = null;
            console.log('PWA was installed');
        });
    </script>

    <!-- Toast System -->
    <script>
        window.showToast = (message, type = 'info', duration = 4000) => {
            const container = document.getElementById('toast-container') || createToastContainer();
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;

            const icons = {
                success: 'fas fa-check-circle',
                error: 'fas fa-exclamation-circle',
                warning: 'fas fa-exclamation-triangle',
                info: 'fas fa-info-circle'
            };

            toast.innerHTML = `
                <i class="${icons[type]}"></i>
                <span>${message}</span>
            `;

            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.add('removing');
                setTimeout(() => toast.remove(), 300);
            }, duration);
        };

        function createToastContainer() {
            const container = document.createElement('div');
            container.id = 'toast-container';
            container.style.cssText = 'position:fixed;top:80px;right:20px;z-index:9998;display:flex;flex-direction:column;gap:10px;pointer-events:none;';
            document.body.appendChild(container);
            return container;
        }
    </script>

    <script type="module">
        console.log('Login.html MODULE script starting...');
        import { auth } from './firebase-config.js';
        import { loginWithEmail, loginWithGoogle, registerWithEmail, logout, handleRedirectAuth } from './auth.js';
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
        // import { initBackgroundSlideshow } from './gallery.js'; // Removed to avoid loading heavy file

        const loginImages = [
            '12. Visita agrosavia 2025 - 8.jpg',
            '14. Sembraton de 1000 árboles - 5.jpg',
            '14. Sembraton de 1000 árboles - 16.jpg',
            '16. Miroorganismos del suelo - 2.jpg',
            '15. Siembra y mantenimiento 5.jpg',
            '16. Miroorganismos del suelo - 3.jpg',
            '17. Visita Microcuenca ARSA - 15.jpg',
            '19. Encuentro UCO - 4.jpg',
            '19. Encuentro UCO - 8.jpg',
            '20. Encuentro Nacional 2025 - 8.jpg'
        ];

        // Exponer funciones globales para mayor compatibilidad
        window.loginWithGoogle = loginWithGoogle;
        window.loginWithEmail = loginWithEmail;
        window.registerWithEmail = registerWithEmail;
        window.handleRedirectAuth = handleRedirectAuth;

        // Start slideshow immediately (module scripts defer by default)
        initBackgroundSlideshow(loginImages);

        function initBackgroundSlideshow(images) {
            const container = document.getElementById('app-background');
            if (!container) return;

            // Create slides
            images.forEach((img, index) => {
                const slide = document.createElement('div');
                slide.className = 'bg-slide';
                slide.style.backgroundImage = `url('assets/images/${img}')`;
                if (index === 0) slide.classList.add('active');
                container.insertBefore(slide, container.firstChild);
            });

            // Cycle logic
            const slides = document.querySelectorAll('.bg-slide');
            if (slides.length < 2) return;
            let current = 0;

            // Store interval ID to prevent memory leak
            const slideshowInterval = setInterval(() => {
                slides[current].classList.remove('active');
                current = (current + 1) % slides.length;
                slides[current].classList.add('active');
            }, 5000);

            // Clean up on page navigation
            window.addEventListener('beforeunload', () => {
                clearInterval(slideshowInterval);
            });
        }

        // Check for Redirect Result on load to catch errors or finish sign-in
        window.addEventListener('load', async () => {
            const isRedirecting = sessionStorage.getItem('googleLoginRedirecting');
            const loader = document.getElementById('auth-loader');
            const container = document.querySelector('.login-container');
            
            if (isRedirecting === 'true' && loader && container) {
                // Ensure splash remains shown visually during async ops
                document.body.classList.add('is-redirecting');
            }

            try {
                await handleRedirectAuth();
            } finally {
                // Return to normal if redirect didn't resolve to a login
                sessionStorage.removeItem('googleLoginRedirecting');
                if (!auth.currentUser) {
                    document.body.classList.remove('is-redirecting');
                }
            }
        });

        window.handleGoogleClick = async () => {
            console.log("GOOGLE BUTTON CLICKED - Redirect Mode");
            const gBtn = document.getElementById('googleLoginBtn');
            const gBtnText = document.getElementById('googleBtnText');

            try {
                if (typeof window.loginWithGoogle !== 'function') {
                    showToast('Error: loginWithGoogle no está cargado todavía.', 'error');
                    return;
                }

                gBtn.disabled = true;
                gBtnText.innerText = "Iniciando...";
                sessionStorage.setItem('googleLoginRedirecting', 'true');

                await window.loginWithGoogle();

            } catch (err) {
                console.error("DEBUG: Google Click Error:", err);
                showToast('Error de Google: ' + err.message, 'error');

                gBtn.disabled = false;
                gBtnText.innerText = "Iniciar con Google";
            }
        };

        // Escuchar el evento click de forma limpia
        document.getElementById('googleLoginBtn')?.addEventListener('click', window.handleGoogleClick);

        // Auth Guard: If already logged in, redirect to index
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // Si estamos en medio de un flujo de login activo, dejar que auth.js maneje el redirect
                if (sessionStorage.getItem('googleLoginRedirecting') === 'true') {
                    return; 
                }
                
                // Instantly swap to splash if navigating via other auth modes
                document.body.classList.add('is-redirecting');
                const splashStatus = document.getElementById('splash-status');
                if (splashStatus) splashStatus.innerText = "Iniciando sesión...";

                document.getElementById('authStatus').innerText = "Sesión detectada. Redirigiendo...";
                // Small delay to ensure IndexedDB persistence is complete before jumping
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);
            } else {
                // No user session found
            }
        });

        // Check for dark mode pref
        if (localStorage.getItem('darkMode') === 'enabled' ||
            window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.body.classList.add('dark-mode');
        }

        // Email Login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = e.target.querySelector('button');

            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Cargando...';
            btn.disabled = true;

            try {
                const user = await loginWithEmail(email, password);
                // Login successful, redirect handled by onAuthStateChanged
                if (user) {
                    window.location.href = 'index.html';
                }
            } catch (error) {
                console.error("Login Error Catch:", error);
                showToast('Error: ' + error.message, 'error');
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });

        // Google Login Listener cleanup
        // The main listener is attached at line 460 via window.handleGoogleClick
        // Removing duplicate listener to avoid "auth/popup-blocked" or race conditions.

        // Quick Test User Creation (For Demo)
        document.getElementById('createTestUserBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            const email = "test" + Date.now() + "@greenforce.com";
            const password = "password123";
            const name = "Usuario de Prueba";

            if (confirm(`¿Crear usuario de prueba?\nEmail: ${email}\nPass: ${password}`)) {
                try {
                    const user = await registerWithEmail(email, password, name);
                    // Test user created successfully
                    // onAuthStateChanged will handle the redirect.
                } catch (err) {
                    console.error("Registration Error:", err);
                    showToast('Error: ' + err.message, 'error');
                }
            }
        });
    </script>
</body>

</html>
