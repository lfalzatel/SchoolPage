<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Green Force</title>
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2E7D32">
    <link rel="icon" type="image/png" href="assets/icons/icon-192.png">

    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background-color: #000;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 1rem;
            overflow: hidden;
            position: relative;
        }

        /* Slideshow background system */
        #bg-slideshow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .bg-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
        }

        .bg-slide.active {
            opacity: 1;
        }

        .bg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1;
        }

        .dark-mode body {
            /* Same dark overlay in dark mode */
            background-image: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.75)), url('assets/images/10.%20Reforestaci%C3%B3n%20institucional%20-%204.jpg');
        }

        .login-container {
            background: rgba(255, 255, 255, 0.95);
            color: #333;
            padding: 1.5rem;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 380px;
            text-align: center;
            backdrop-filter: blur(8px);
        }

        .dark-mode .login-container {
            background: rgba(245, 245, 245, 0.95);
            color: #1a1a1a;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
        }

        .login-logo img {
            width: 80px;
            /* Reduced size */
            height: 80px;
            object-fit: contain;
            border-radius: 50%;
            margin-bottom: 0.5rem;
            /* Reduced margin */
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .login-title {
            color: var(--primary-color);
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        .login-subtitle {
            color: #444;
            /* Darker for better contrast in light mode */
            margin-bottom: 1.2rem;
            /* Reduced margin */
            font-size: 0.85rem;
        }

        .dark-mode .login-subtitle {
            color: #555;
        }

        .form-group {
            margin-bottom: 1.2rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            font-weight: 600;
            color: #444;
        }

        .dark-mode .form-group label {
            color: #333;
        }

        .form-input {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-family: 'Poppins', sans-serif;
            transition: border-color 0.3s;
        }

        .form-input:focus {
            border-color: var(--primary-color);
            outline: none;
        }

        .dark-mode .form-input {
            background: #fff;
            border-color: #ccc;
            color: #333;
        }

        .dark-mode .form-input::placeholder {
            color: #999;
        }

        .btn-submit {
            width: 100%;
            padding: 1rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            margin-top: 1rem;
        }

        .btn-submit:hover {
            background: var(--secondary-color);
            transform: translateY(-2px);
        }

        .divider {
            margin: 1.2rem 0;
            /* Reduced margin */
            display: flex;
            align-items: center;
            color: #333;
            font-size: 0.85rem;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #ddd;
        }

        .divider span {
            padding: 0 10px;
        }

        .google-btn {
            background: white;
            color: #333;
            border: 1px solid #ddd;
            width: 100%;
            padding: 0.8rem;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
        }

        .google-btn:hover {
            background: #f5f5f5;
        }

        .dark-mode .google-btn {
            background: #333;
            color: white;
            border-color: #555;
        }

        .dark-mode .google-btn:hover {
            background: #444;
        }

        .back-link {
            display: block;
            margin-top: 1.5rem;
            color: #666;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back-link:hover {
            color: var(--primary-color);
        }

        .dark-mode .back-link {
            color: #aaa;
        }

        /* Fix: Dropdown hereda color blanco del header verde */
        .profile-dropdown .dropdown-item {
            color: #4b5563 !important;
        }

        .profile-dropdown .dropdown-item.text-red {
            color: #ef4444 !important;
        }

        .profile-dropdown .dropdown-item i {
            color: #9ca3af !important;
        }

        .profile-dropdown .dropdown-item:hover {
            color: #111827 !important;
            background-color: #f9fafb;
        }

        .profile-dropdown .dropdown-item:hover i {
            color: #059669 !important;
        }

        #menuProfileName {
            color: #111827 !important;
        }

        .profile-dropdown .text-gray {
            color: #6b7280 !important;
        }
    </style>
</head>

<body>

    <div id="bg-slideshow">
        <div class="bg-overlay"></div>
    </div>

    <div class="login-container">
        <div class="login-logo">
            <img src="assets/images/1. logo 3.jpg" alt="Green Force Logo">
        </div>
        <h2 class="login-title">Bienvenido a Green Force</h2>
        <p class="login-subtitle">Accede para gestionar actividades y ver contenido exclusivo</p>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <div style="position: relative;">
                    <i class="fas fa-envelope" style="position: absolute; left: 15px; top: 15px; color: #888;"></i>
                    <input type="email" id="email" class="form-input" placeholder="ejemplo@greenforce.com"
                        style="padding-left: 40px;" required>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <div style="position: relative;">
                    <i class="fas fa-lock" style="position: absolute; left: 15px; top: 15px; color: #888;"></i>
                    <input type="password" id="password" class="form-input" placeholder="••••••••"
                        style="padding-left: 40px;" required>
                </div>
            </div>

            <button type="submit" class="btn-submit">
                <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
            </button>
        </form>

        <div class="divider">
            <span>O continúa con</span>
        </div>

        <button id="googleLoginBtn" class="google-btn" onclick="handleGoogleClick()">
            <i class="fab fa-google" style="color: #DB4437;"></i> Google
        </button>

        <button id="installAppBtn" class="google-btn"
            style="display: none; margin-top: 1rem; background: #2E7D32; color: white; border: none;">
            <i class="fas fa-download"></i> Instalar Aplicación
        </button>

        <div id="authStatus" style="margin-top: 1rem; font-size: 0.85rem; color: #555;"></div>

        <div style="margin-top: 2rem;">
            <button onclick="localStorage.clear(); sessionStorage.clear(); location.reload(true);"
                style="background: none; border: 1px solid #ccc; color: #666; padding: 0.5rem 1rem; border-radius: 5px; font-size: 0.8rem; cursor: pointer;">
                Forzar Recarga Completa (Limpiar Caché)
            </button>
            <br>
            <a href="#" id="createTestUserBtn"
                style="color: #999; text-decoration: none; font-size: 0.7rem; display: block; margin-top: 10px;">(Debug:
                Crear Usuario de Prueba)</a>
        </div>
    </div>

    <script>
        window.onerror = function (msg, url, lineNo, columnNo, error) {
            console.error('GLOBAL ERROR:', msg, 'at', url, 'line', lineNo);
            alert('Error crítico de carga: ' + msg);
            return false;
        };
        // Background Slideshow Logic
        const images = [
            '10. Reforestación institucional - 4.jpg',
            '12. Visita agrosavia 2025 - 8.jpg',
            '14. Sembratón de 1000 árboles - 5.jpg',
            '14. Sembratón de 1000 árboles - 16.jpg',
            '15. Siembra y mantenimiento 5.jpg',
            '16. Microorganismos del suelo - 2.jpg',
            '16. Microorganismos del suelo - 3.jpg',
            '17. Visita Microcuenca ARSA - 15.jpg',
            '19. Encuentro UCO - 4.jpg',
            '19. Encuentro UCO - 8.jpg',
            '20. Encuentro Nacional 2025 - 8.jpg'
        ];

        const slideshowContainer = document.getElementById('bg-slideshow');
        let currentSlide = 0;

        function initSlideshow() {
            images.forEach((img, index) => {
                const slide = document.createElement('div');
                slide.className = `bg-slide ${index === 0 ? 'active' : ''}`;
                slide.style.backgroundImage = `url('assets/images/${encodeURIComponent(img)}')`;
                slideshowContainer.appendChild(slide);
            });

            setInterval(nextSlide, 3000); // Change every 3 seconds
        }

        function nextSlide() {
            const slides = document.querySelectorAll('.bg-slide');
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }

        document.addEventListener('DOMContentLoaded', () => {
            console.log('Login.html generic script starting...');
            initSlideshow();
        });
    </script>
    <script>
        // --- PWA Installation Logic ---
        let deferredPrompt;
        const installBtn = document.getElementById('installAppBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            if (installBtn) installBtn.style.display = 'flex';
            installBtn.style.display = 'flex';
            console.log('beforeinstallprompt fired');
        });

        async function forceFullReload() {
            if ('serviceWorker' in navigator) {
                const registrations = await navigator.serviceWorker.getRegistrations();
                for (let registration of registrations) {
                    await registration.unregister();
                }
            }
            const cacheNames = await caches.keys();
            for (let name of cacheNames) {
                await caches.delete(name);
            }
            window.location.reload(true);
        }
        window.forceFullReload = forceFullReload;

        installBtn.addEventListener('click', async () => {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            console.log(`User response to the install prompt: ${outcome}`);
            deferredPrompt = null;
            installBtn.style.display = 'none';
        });

        window.addEventListener('appinstalled', () => {
            installBtn.style.display = 'none';
            deferredPrompt = null;
            console.log('PWA was installed');
        });
    </script>

    <script type="module">
        console.log('Login.html MODULE script starting...');
        import { auth } from './firebase-config.js';
        import { loginWithEmail, loginWithGoogle, registerWithEmail, logout } from './auth.js';
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

        // Exponer funciones globales para mayor compatibilidad
        window.loginWithGoogle = loginWithGoogle;
        window.loginWithEmail = loginWithEmail;
        window.registerWithEmail = registerWithEmail;

        window.handleGoogleClick = async () => {
            console.log("GOOGLE BUTTON CLICKED (GLOBAL HANDLER)");
            try {
                if (typeof window.loginWithGoogle !== 'function') {
                    alert("Error: loginWithGoogle no está cargado todavía.");
                    return;
                }
                await window.loginWithGoogle();
            } catch (err) {
                console.error("DEBUG: Google Click Error:", err);
                alert("Error de Google: " + err.message);
            }
        };

        // Auth Guard: If already logged in, redirect to index
        onAuthStateChanged(auth, (user) => {
            if (user) {
                console.log("User already logged in, redirecting...");
                window.location.href = 'index.html';
            }
        });

        // Check for dark mode pref
        if (localStorage.getItem('darkMode') === 'enabled' ||
            window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.body.classList.add('dark-mode');
        }

        // Email Login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            console.log("Login form submitted");

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = e.target.querySelector('button');

            console.log("Attempting login for:", email);

            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Cargando...';
            btn.disabled = true;

            try {
                const user = await loginWithEmail(email, password);
                console.log("Login successful, user:", user);
                // Redirect handled by onAuthStateChanged, but let's force check
                if (user) {
                    window.location.href = 'index.html';
                }
            } catch (error) {
                console.error("Login Error Catch:", error);
                alert("Error: " + error.message);
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });

        // Google Login Listener (Redundant but safe)
        const gBtn = document.getElementById('googleLoginBtn');
        if (gBtn) {
            console.log("Google button listener attached successfully");
            gBtn.addEventListener('click', () => {
                console.log("Google login listener (addEventListener) detected click");
            });
        } else {
            console.error("CRITICAL: Google button not found in DOM during script init");
        }

        // Quick Test User Creation (For Demo)
        document.getElementById('createTestUserBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            console.log("Create Test User clicked");
            const email = "test" + Date.now() + "@greenforce.com";
            const password = "password123";
            const name = "Usuario de Prueba";

            if (confirm(`¿Crear usuario de prueba?\nEmail: ${email}\nPass: ${password}`)) {
                try {
                    console.log("Registering test user...");
                    await registerWithEmail(email, password, name);
                    alert("Usuario creado! Iniciando sesión...");
                    window.location.href = 'index.html';
                } catch (err) {
                    console.error("Registration Error:", err);
                    alert("Error: " + err.message);
                }
            }
        });
    </script>
</body>

</html>
