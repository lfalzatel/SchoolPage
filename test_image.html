<!DOCTYPE html>
<html>

<head>
    <title>Test Image</title>
</head>

<body style="background: #333; color: white;">
    <h1>Testing Image Paths</h1>

    <h2>1. Direct Image Tag (Encoded)</h2>
    <img src="assets/images/1.%20logo%201.jpg" style="width: 200px;">

    <h2>2. Background Image Style (Encoded)</h2>
    <div
        style="width: 200px; height: 200px; background-image: url('assets/images/1.%20logo%201.jpg'); background-size: cover; border: 1px solid red;">
    </div>

    <h2>3. Direct Image Tag (Unencoded)</h2>
    <img src="assets/images/1. logo 1.jpg" style="width: 200px;">
</body>

</html>
